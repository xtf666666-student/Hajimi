<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>哈基米</title>
    <link rel="stylesheet" href="./pet.css" />
  </head>
  <body>
    <div class="stage" id="stage">
      <div class="badge" id="badge" title="进行中的对话数">
        <span id="badge-count">0</span>
      </div>
      <div class="bubble" id="bubble"><span id="bubble-text"></span></div>
      <div class="shadow" id="shadow"></div>
      <div class="float" id="float">
        <div class="tilt" id="tilt">
          <img id="body" class="pet" alt="哈基米" draggable="false" />
          <img id="head" class="head" alt="" draggable="false" />
          <span class="spark" id="spark">✦</span>
        </div>
      </div>
      <div class="list" id="list" hidden></div>
    </div>
    <script type="module" src="./pet.ts"></script>
  </body>
</html>
