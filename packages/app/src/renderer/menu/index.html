<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws:"
    />
    <title>哈基米菜单</title>
    <link rel="stylesheet" href="./menu.css" />

    <nav class="menu" id="menu" role="menu" aria-label="哈基米菜单">
