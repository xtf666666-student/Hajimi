<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>哈基米菜单</title>
    <link rel="stylesheet" href="./menu.css" />
  </head>
  <body>
    <nav class="menu" id="menu" role="menu" aria-label="哈基米菜单">
      <button class="item" role="menuitem" data-action="open-dsh">
        <span class="icon">↗</span>打开 DeepSeek Harness
      </button>
      <button class="item" role="menuitem" data-action="refresh">
        <span class="icon">↻</span>刷新对话状态
      </button>
      <button class="item" role="menuitem" data-action="size">
        <span class="icon">⤢</span>切换大小
      </button>
      <button class="item" role="menuitem" data-action="toggle-anim">
        <span class="icon">✦</span><span id="anim-label">关闭动画</span>
      </button>
      <div class="divider"></div>
      <button class="item" role="menuitem" data-action="hide">
        <span class="icon">－</span>隐藏桌宠
      </button>
      <button class="item danger" role="menuitem" data-action="quit">
        <span class="icon">×</span>退出
      </button>
    </nav>
    <script type="module" src="./menu.ts"></script>
  </body>
</html>
