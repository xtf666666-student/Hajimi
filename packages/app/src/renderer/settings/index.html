<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws:"
    />
    <title>哈基米设置</title>
    <link rel="stylesheet" href="./settings.css" />
  </head>
  <body>
    <main class="card">
      <header class="card-head">
        <div class="title-wrap">
          <div class="mini-avatar" aria-hidden="true">🐱</div>
          <div>
            <h1>哈基米设置</h1>
            <p class="sub">今天也要好好摸鱼喵</p>
          </div>
        </div>
        <button class="icon-btn" id="btn-close" title="关闭（不会退出桌宠）" aria-label="关闭">✕</button>
      </header>

      <div class="card-body">
        <section class="panel">
          <h2>外观</h2>
          <div class="row">
            <label class="row-label" for="size">桌宠大小</label>
            <span class="value" id="size-value">200 px</span>
          </div>
          <input class="range" id="size" type="range" min="100" max="320" step="4" value="200" />
          <div class="chips" id="size-presets">
            <button class="chip" data-size="140">小</button>
            <button class="chip" data-size="200">中</button>
            <button class="chip" data-size="280">大</button>
          </div>

          <div class="row spaced">
            <label class="row-label" for="opacity">透明度</label>
            <span class="value" id="opacity-value">100%</span>
          </div>
          <input class="range" id="opacity" type="range" min="35" max="100" step="1" value="100" />
        </section>

        <section class="panel">
          <h2>行为</h2>
          <label class="switch-row">
            <span>
              <b>主动说话</b>
              <small>每隔一会儿冒一句，默认安静</small>
            </span>
            <input type="checkbox" id="autoSpeak" />
            <i class="switch" aria-hidden="true"></i>
          </label>
          <label class="switch-row">
            <span>
              <b>动画效果</b>
              <small>呼吸、眨眼、弹跳与粒子</small>
            </span>
            <input type="checkbox" id="animations" />
            <i class="switch" aria-hidden="true"></i>
          </label>
          <label class="switch-row">
            <span>
              <b>始终置顶</b>
              <small>让哈基米保持在普通窗口上方</small>
            </span>
            <input type="checkbox" id="alwaysOnTop" />
            <i class="switch" aria-hidden="true"></i>
          </label>
        </section>

        <section class="panel">
          <h2>状态</h2>
          <div class="hunger-row">
            <span class="row-label">饱食度</span>
            <span class="value" id="hunger-value">70 · 还算饱</span>
          </div>
          <div class="hunger-bar"><div class="hunger-fill" id="hunger-fill"></div></div>
          <div class="stats">
            <div class="stat"><b id="stat-clicks">0</b><span>互动</span></div>
            <div class="stat"><b id="stat-pets">0</b><span>摸头</span></div>
            <div class="stat"><b id="stat-feeds">0</b><span>喂食</span></div>
            <div class="stat"><b id="stat-days">1</b><span>陪伴天数</span></div>
          </div>
        </section>

        <section class="panel actions">
          <button class="btn ghost" id="btn-reset">恢复默认设置</button>
          <button class="btn ghost" id="btn-hide">暂时隐藏</button>
          <button class="btn danger" id="btn-quit">退出桌宠</button>
        </section>
      </div>

      <footer class="card-foot">
        <span id="version">v1.0.0</span>
        <span>设置仅保存在本机，不会上传</span>
      </footer>
    </main>
    <script type="module" src="./settings.ts"></script>
  </body>
</html>
