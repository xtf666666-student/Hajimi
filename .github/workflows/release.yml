name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只构建不发布'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_BUILDER_BINARIES_MIRROR: 'https://npmmirror.com/mirrors/electron-builder-binaries/'
      ELECTRON_MIRROR: 'https://npmmirror.com/mirrors/electron/'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: TypeScript 检查
        run: npm run typecheck

      - name: 构建桌宠
        run: npm run build -w @hajimi/app

      - name: 应用自检（真实启动 + 截图）
        run: npm run selftest -w @hajimi/app
        continue-on-error: true

      - name: 上传自检证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-artifacts
          path: packages/app/selftest-artifacts
          if-no-files-found: ignore

      - name: 打包 Windows 安装包 / 便携版
        run: npx electron-builder --win --x64 --publish never
        working-directory: packages/app

      - name: CLI 测试
        run: npm run test -w @hajimi/cli

      - name: 生成注册表与校验和
        run: node scripts/make-manifest.mjs

      - name: 发布物端到端校验
        run: node scripts/verify-release.mjs

      - name: 准备发布文件
        run: |
          mkdir dist-release
          copy packages\app\release\*.exe dist-release\
          copy packages\app\release\*.blockmap dist-release\
          copy packages\app\release\SHA256SUMS.txt dist-release\
          copy packages\app\release\pets.json dist-release\

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist-release

      - name: 创建 GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          name: 哈基米桌宠 ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist-release/*.exe
            dist-release/*.blockmap
            dist-release/SHA256SUMS.txt
            dist-release/pets.json

      - name: 发布 CLI 到 npm（需要 NPM_TOKEN）
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: packages/cli
        shell: pwsh
        run: |
          if (-not $env:NPM_TOKEN) {
            Write-Host "未配置 NPM_TOKEN，跳过 npm 发布（GitHub Release 已上传）"
            exit 0
          }
          npm config set //registry.npmjs.org/:_authToken $env:NPM_TOKEN
          npm publish --access public
